<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 595">
  <defs>
    <style>
      .gy-bg { fill: #fcfaff; }
      .gy-violet { fill: #7c3aed; opacity: .1; }
      .gy-violet-strong { fill: #6d28d9; opacity: .2; }
      .gy-pink { fill: #ec4899; opacity: .12; }
      .gy-gold { fill: #eab308; opacity: .55; }
    </style>
  </defs>
  <rect class="gy-bg" width="842" height="595"/>
  <!-- Large flowing ribbon (top-left diagonal swoosh) -->
  <path class="gy-violet" d="M-40,180 Q140,40 320,160 Q500,280 680,120 Q780,60 880,140 L880,200 Q780,120 680,180 Q500,340 320,220 Q140,100 -40,240 Z"/>
  <path class="gy-pink" d="M-40,140 Q140,0 320,120 Q500,240 680,80 L680,110 Q500,270 320,150 Q140,30 -40,170 Z"/>
  <!-- Bottom ribbon swoosh -->
  <path class="gy-violet-strong" d="M-40,475 Q200,540 420,470 Q640,400 880,460 L880,505 Q640,445 420,515 Q200,585 -40,520 Z"/>
  <!-- Rhythmic gymnastics ball - large translucent circle -->
  <circle class="gy-violet" cx="700" cy="380" r="120"/>
  <circle class="gy-pink" cx="700" cy="380" r="80"/>
  <!-- Smaller gymnastics balls -->
  <circle class="gy-violet-strong" cx="130" cy="430" r="38"/>
  <circle class="gy-pink" cx="80" cy="380" r="22"/>
  <!-- Gold star/sparkle highlights -->
  <g class="gy-gold">
    <polygon points="755,90 760,103 773,103 763,111 766,124 755,116 744,124 747,111 737,103 750,103"/>
    <polygon points="80,180 83,189 92,189 85,194 87,202 80,197 73,202 75,194 68,189 77,189"/>
    <circle cx="195" cy="100" r="6"/>
    <circle cx="615" cy="470" r="5"/>
  </g>
</svg>
