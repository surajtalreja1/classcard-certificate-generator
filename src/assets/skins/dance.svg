<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 595">
  <defs>
    <style>
      .dn-bg { fill: #fff8f6; }
      .dn-coral { fill: #f43f5e; opacity: .1; }
      .dn-coral-strong { fill: #e11d48; opacity: .18; }
      .dn-warm { fill: #fb923c; opacity: .14; }
      .dn-gold { fill: #eab308; opacity: .55; }
    </style>
  </defs>
  <rect class="dn-bg" width="842" height="595"/>
  <!-- Large spiraling motion curves (top-right) -->
  <path class="dn-coral" d="M880,0 L600,0 Q650,60 720,80 Q820,100 840,180 Q860,260 770,300 Q680,340 710,420 Q740,500 880,520 Z"/>
  <path class="dn-coral-strong" d="M880,80 Q780,90 760,150 Q740,210 820,240 L880,250 Z"/>
  <!-- Bottom-left dance motion swoop -->
  <path class="dn-coral" d="M0,595 L0,420 Q80,460 130,520 Q180,580 280,595 Z"/>
  <path class="dn-warm" d="M0,595 L0,380 Q60,420 110,480 Q160,540 250,595 Z"/>
  <!-- Curve overlay (movement trail) -->
  <path d="M40,500 Q160,400 280,460 Q400,520 520,440 Q640,360 760,420" stroke="#e11d48" stroke-width="2" fill="none" opacity=".25"/>
  <!-- Music note dots scattered -->
  <g class="dn-gold">
    <circle cx="170" cy="160" r="7"/>
    <circle cx="220" cy="130" r="4"/>
    <line x1="174" y1="160" x2="174" y2="100" stroke="#eab308" stroke-width="2" opacity="1"/>
    <circle cx="600" cy="500" r="6"/>
    <circle cx="650" cy="475" r="3.5"/>
    <line x1="603" y1="500" x2="603" y2="450" stroke="#eab308" stroke-width="2" opacity="1"/>
  </g>
  <!-- Floating sparkles -->
  <g class="dn-gold">
    <polygon points="280,80 283,89 292,89 285,94 287,103 280,98 273,103 275,94 268,89 277,89"/>
    <polygon points="730,230 733,239 742,239 735,244 737,253 730,248 723,253 725,244 718,239 727,239"/>
  </g>
  <!-- Soft circles (rhythm beats) -->
  <circle class="dn-coral" cx="450" cy="80" r="30" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity=".2"/>
  <circle class="dn-coral" cx="450" cy="80" r="50" fill="none" stroke="#f43f5e" stroke-width="1" opacity=".15"/>
</svg>
