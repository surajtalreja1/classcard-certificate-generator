<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 595">
  <defs>
    <style>
      .fb-bg { fill: #f8fbf6; }
      .fb-green { fill: #16a34a; opacity: .1; }
      .fb-green-strong { fill: #15803d; opacity: .2; }
      .fb-grass { fill: #22c55e; opacity: .08; }
      .fb-gold { fill: #eab308; opacity: .55; }
    </style>
  </defs>
  <rect class="fb-bg" width="842" height="595"/>
  <!-- Field stripe bands (alternating tones of green) -->
  <rect class="fb-green" x="0" y="0" width="120" height="595"/>
  <rect class="fb-grass" x="240" y="0" width="120" height="595"/>
  <rect class="fb-green" x="480" y="0" width="120" height="595"/>
  <rect class="fb-grass" x="720" y="0" width="122" height="595"/>
  <!-- White background overlay to soften stripes (leaves center mostly clear) -->
  <rect fill="#fdfdf9" opacity=".5" width="842" height="595"/>
  <!-- Center circle (football field) -->
  <circle cx="421" cy="297" r="180" fill="none" stroke="#15803d" stroke-width="1.5" opacity=".15"/>
  <circle cx="421" cy="297" r="8" fill="#15803d" opacity=".25"/>
  <!-- Top-left stylized soccer ball -->
  <g transform="translate(105 105)" opacity=".3">
    <circle r="55" fill="#f8fbf6"/>
    <circle r="55" fill="none" stroke="#15803d" stroke-width="1.5"/>
    <polygon points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13" fill="#18181b" opacity=".25"/>
    <line x1="0" y1="-26" x2="0" y2="-50" stroke="#15803d" stroke-width="1" opacity=".6"/>
    <line x1="22" y1="-13" x2="44" y2="-26" stroke="#15803d" stroke-width="1" opacity=".6"/>
    <line x1="22" y1="13" x2="44" y2="26" stroke="#15803d" stroke-width="1" opacity=".6"/>
    <line x1="0" y1="26" x2="0" y2="50" stroke="#15803d" stroke-width="1" opacity=".6"/>
    <line x1="-22" y1="13" x2="-44" y2="26" stroke="#15803d" stroke-width="1" opacity=".6"/>
    <line x1="-22" y1="-13" x2="-44" y2="-26" stroke="#15803d" stroke-width="1" opacity=".6"/>
  </g>
  <!-- Bottom-right large ball -->
  <g transform="translate(730 475)" opacity=".3">
    <circle r="62" fill="#f8fbf6"/>
    <circle r="62" fill="none" stroke="#15803d" stroke-width="2"/>
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#18181b" opacity=".25"/>
  </g>
  <!-- Gold accent stars (winning) -->
  <g class="fb-gold">
    <polygon points="180,490 184,500 195,500 186,506 189,517 180,510 171,517 174,506 165,500 176,500"/>
    <polygon points="700,90 703,99 712,99 705,104 707,113 700,108 693,113 695,104 688,99 697,99"/>
    <polygon points="420,75 423,84 432,84 425,89 427,98 420,93 413,98 415,89 408,84 417,84"/>
  </g>
  <!-- Goal post lines (corners) -->
  <line x1="0" y1="40" x2="60" y2="40" stroke="#15803d" stroke-width="2" opacity=".3"/>
  <line x1="60" y1="40" x2="60" y2="0" stroke="#15803d" stroke-width="2" opacity=".3"/>
  <line x1="842" y1="555" x2="782" y2="555" stroke="#15803d" stroke-width="2" opacity=".3"/>
  <line x1="782" y1="555" x2="782" y2="595" stroke="#15803d" stroke-width="2" opacity=".3"/>
</svg>
