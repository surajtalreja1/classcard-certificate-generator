  <path class="sw-mid" d="M0,535 C140,575 280,515 420,550 C560,585 700,515 842,555 L842,505 C700,465 560,535 420,500 C280,465 140,525 0,485 Z"/>
  <!-- Bubble accents (water droplets) -->
  <circle class="sw-light" cx="155" cy="430" r="42"/>
  <circle class="sw-light" cx="85" cy="380" r="22"/>
  <circle class="sw-light" cx="720" cy="180" r="55"/>
  <circle class="sw-light" cx="780" cy="245" r="28"/>
